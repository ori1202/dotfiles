# Minimal Hyprland config for Sunshine streaming

monitor=,preferred,auto,1

exec-once = hyprctl dispatch workspace 10

# optional background
exec-once = swaybg -c 000000

# prevent accidental workspace switching
bind = SUPER,1,workspace,10

# disable animations (lower latency)
animations {
    enabled = no
}

misc {
    disable_hyprland_logo = true
}
