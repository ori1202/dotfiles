# =============================================================================
# Mouse / pointer presets for Hyprland — REFERENCE ONLY (do not source this file)
#
# Copy ONE preset’s lines (uncomment them) into input { } in hyprland.conf,
# replacing your current follow_mouse / force_no_accel / accel_profile /
# sensitivity lines. Hyprland allows only one active input { } block.
#
# https://wiki.hypr.land/Configuring/Variables/#input
# Per-device: https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs
# =============================================================================
#
# sensitivity ∈ [-1.0, 1.0]. accel_profile: adaptive | flat | custom …
# force_no_accel = true is “raw” mode; Hyprland warns it may desync the cursor.
#
# follow_mouse: 0 = focus does not follow cursor; 1 = always;
#               2 = split cursor vs keyboard focus; 3 = cursor never moves kbd focus.
# =============================================================================

# --- FPS / tac-shooter (matches your current “CS” style) ---
# follow_mouse = 1
# force_no_accel = 0
# accel_profile = flat
# sensitivity = 0

# --- Desktop / general (libinput default acceleration, slight boost) ---
# follow_mouse = 1
# force_no_accel = 0
# accel_profile =
# sensitivity = 0.15

# --- Snappy / large desktop (flat + faster) ---
# follow_mouse = 1
# force_no_accel = 0
# accel_profile = flat
# sensitivity = 0.35

# --- Precision / editing / CAD (slow, predictable) ---
# follow_mouse = 1
# force_no_accel = 0
# accel_profile = flat
# sensitivity = -0.45

# --- Tiling / keyboard-first (pointer does not change focus) ---
# follow_mouse = 0
# force_no_accel = 0
# accel_profile = flat
# sensitivity = 0

# --- Hybrid focus (try if you want cursor focus separate from keyboard) ---
# follow_mouse = 2
# force_no_accel = 0
# accel_profile = flat
# sensitivity = 0

# --- Comfort / long sessions (adaptive acceleration) ---
# follow_mouse = 1
# force_no_accel = 0
# accel_profile = adaptive
# sensitivity = 0.0

# --- Extra: faster scroll (pair with any preset; still inside input { }) ---
# scroll_factor = 1.25

# =============================================================================
# Per-device — use name from: hyprctl devices
# One device { } block per physical device you want to override.
# =============================================================================

# device {
#     name = epic-mouse-v1
#     sensitivity = -0.5
# }

# Same mouse, slower than your current device offset:
# device {
#     name = epic-mouse-v1
#     sensitivity = -0.65
# }

# Offset neutral if you tune sensitivity globally instead:
# device {
#     name = epic-mouse-v1
#     sensitivity = 0.0
# }
