[package]
name = "waybar-hypr-ws"
version = "0.1.0"
edition = "2021"
description = "Hyprland workspace titles for Waybar: CFFI GTK module and optional CLI daemon"
license = "GPL-3.0-or-later"

[lib]
name = "waybar_hypr_ws"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "waybar-hypr-ws"
path = "src/bin/waybar-hypr-ws.rs"

[dependencies]
async-channel = "2"
hyprland = { version = "0.4.0-beta.3", default-features = false, features = [
    "data",
    "dispatch",
    "listener",
] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
waybar-cffi = { git = "https://github.com/justbuchanan/waybar-cffi-rs", rev = "0cfa5fc5eaaf695effb53e34b8976d00531a6dfe", package = "waybar-cffi" }
